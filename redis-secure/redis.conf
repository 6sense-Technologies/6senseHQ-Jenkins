tls-port 0
port 6379

# tls-cert-file /usr/local/etc/redis/redis.crt
# tls-key-file /usr/local/etc/redis/redis.key
# tls-ca-cert-file /usr/local/etc/redis/ca.crt

tls-auth-clients no
protected-mode yes

# Redis 8 ships built-in modules (Search, JSON, etc.) that need CONFIG at startup.
# rename-command CONFIG is incompatible — use ACL rules instead (rename-command is deprecated).
user default on >xkh_arq9wnm*HZJ!hrf ~* &* +@all -config -flushall -flushdb
